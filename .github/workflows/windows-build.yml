name: Windows Build

on:
  push:
    branches:
      - main
      - feature/intro-editor
      - feature/texture-transparency-pass1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VPWStudio
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build Release configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          msbuild .\VPWStudio\VPWStudio.sln `
            /m `
            /t:Rebuild `
            /p:Configuration=Release `
            '/p:Platform=Any CPU' `
            /p:RunCodeAnalysis=false `
            /v:minimal `
            /bl:VPWStudio\build.binlog

      - name: Build bundled AKI Sound Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "External\AKISoundStudio"

          $buildDirectory = Join-Path `
            $sourceDirectory `
            "build"

          cmake `
            -S $sourceDirectory `
            -B $buildDirectory `
            -A x64 `
            -DBUILD_TESTING=OFF `
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"

          cmake `
            --build $buildDirectory `
            --config Release `
            --parallel

          $soundExecutable = Join-Path `
            $buildDirectory `
            "Release\AKISoundStudio.exe"

          if (-not (Test-Path -LiteralPath $soundExecutable)) {
            throw "AKISoundStudio.exe was not produced."
          }

      - name: Stage bundled sound editor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "External\AKISoundStudio"

          $buildDirectory = Join-Path `
            $sourceDirectory `
            "build\Release"

          $outputDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "VPWStudio\VPWStudio\bin\Release"

          $destination = Join-Path `
            $outputDirectory `
            "SoundEditor"

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force | Out-Null

          Copy-Item `
            -LiteralPath (
              Join-Path `
                $buildDirectory `
                "AKISoundStudio.exe"
            ) `
            -Destination $destination `
            -Force

          $builtData = Join-Path `
            $buildDirectory `
            "data"

          $sourceData = Join-Path `
            $sourceDirectory `
            "data"

          $dataToCopy = if (
            Test-Path -LiteralPath $builtData
          ) {
            $builtData
          } else {
            $sourceData
          }

          Copy-Item `
            -LiteralPath $dataToCopy `
            -Destination (
              Join-Path `
                $destination `
                "data"
            ) `
            -Recurse `
            -Force

      - name: Verify Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $outputDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "VPWStudio\VPWStudio\bin\Release"

          $executable = Join-Path `
            $outputDirectory `
            "VPWStudio.exe"

          $soundEditor = Join-Path `
            $outputDirectory `
            "SoundEditor\AKISoundStudio.exe"

          if (-not (Test-Path -LiteralPath $executable)) {
            throw "VPWStudio.exe was not produced at $executable"
          }

          if (-not (Test-Path -LiteralPath $soundEditor)) {
            throw "Bundled AKISoundStudio.exe was not staged."
          }

          Get-ChildItem `
            -LiteralPath $outputDirectory `
            -Recurse |
            Select-Object FullName, Length

      - name: Package Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $outputDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "VPWStudio\VPWStudio\bin\Release"

          $artifactDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifact"

          $zipPath = Join-Path `
            $artifactDirectory `
            "VPWStudio-BAMP-Edition-Windows.zip"

          New-Item `
            -ItemType Directory `
            -Path $artifactDirectory `
            -Force | Out-Null

          Compress-Archive `
            -Path "$outputDirectory\*" `
            -DestinationPath $zipPath `
            -Force

          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "The Windows build ZIP was not created."
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: VPWStudio-BAMP-Windows
          path: artifact/VPWStudio-BAMP-Edition-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: VPWStudio-BAMP-Build-Diagnostics
          path: |
            VPWStudio/build.binlog
            VPWStudio/VPWStudio/bin/Release/**
            External/AKISoundStudio/build/**
          if-no-files-found: warn
          retention-days: 30
